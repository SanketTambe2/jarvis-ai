<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jarvis AI</title>

<style>
*{box-sizing:border-box;font-family:Segoe UI;}
body{
 margin:0;height:100vh;
 background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
 display:flex;
}

/* Sidebar */
.sidebar{
 width:260px;
 background:rgba(0,0,0,.5);
 color:white;
 padding:15px;
 display:flex;
 flex-direction:column;
}
.sidebar h2{color:#00eaff;text-align:center;}
.newchat{
 background:#00eaff;border:none;padding:10px;border-radius:10px;cursor:pointer;
}
.history{flex:1;overflow-y:auto;margin-top:10px;}
.history div{
 padding:8px;
 border-radius:6px;
 margin-bottom:5px;
 background:#1b2b3a;
 cursor:pointer;
}
.footer{
 font-size:12px;
 text-align:center;
 margin-top:10px;
}
.footer a{
 color:#00eaff;
 text-decoration:none;
}

/* Main */
.main{flex:1;display:flex;flex-direction:column;}
.header{
 padding:12px;
 text-align:center;
 color:#00eaff;
 background:rgba(0,0,0,.4);
}

/* Chat */
.chat{flex:1;padding:20px;overflow-y:auto;}

.user,.ai{
 max-width:60%;
 padding:12px;
 margin-bottom:10px;
 border-radius:12px;
}
.user{background:#00eaff;color:black;margin-left:auto;}
.ai{background:#1f2a40;color:white;}

.input{
 display:flex;gap:10px;padding:15px;background:rgba(0,0,0,.4);
}
input{
 flex:1;padding:10px;border-radius:8px;border:none;
}
button{padding:10px;border:none;border-radius:8px;cursor:pointer;}
.send{background:#00eaff;}
.mic{background:#ff004c;color:white;}
</style>
</head>

<body>

<div class="sidebar">
<h2>🤖 Jarvis</h2>
<button class="newchat" onclick="newChat()">➕ New Chat</button>

<div id="history" class="history"></div>

<div class="footer">
Created by Sanket Tambe<br>
<a href="https://sankettambe2.github.io/" target="_blank">📞 Contact</a>
</div>
</div>

<div class="main">
<div class="header">Jarvis AI</div>
<div id="chat" class="chat"></div>

<div class="input">
<input id="msg" placeholder="Ask Jarvis...">
<button class="mic" onclick="voice()">🎤</button>
<button class="send" onclick="send()">Send</button>
</div>
</div>

<script>
let chats = JSON.parse(localStorage.getItem("jarvisChats")) || [];
let currentChat = chats.length;

const chatBox=document.getElementById("chat");
const historyBox=document.getElementById("history");

function save(){
 localStorage.setItem("jarvisChats",JSON.stringify(chats));
 renderHistory();
}

function renderHistory(){
 historyBox.innerHTML="";
 chats.forEach((c,i)=>{
  let d=document.createElement("div");
  d.innerText="Chat "+(i+1);
  d.onclick=()=>loadChat(i);
  historyBox.appendChild(d);
 });
}

function loadChat(i){
 currentChat=i;
 chatBox.innerHTML="";
 chats[i].forEach(m=>bubble(m.text,m.type));
}

function bubble(t,c){
 let d=document.createElement("div");
 d.className=c;
 d.innerText=t;
 chatBox.appendChild(d);
 chatBox.scrollTop=chatBox.scrollHeight;
}

function send(){
 let m=msg.value;
 if(!m)return;
 bubble(m,"user");
 msg.value="";

 chats[currentChat]=chats[currentChat]||[];
 chats[currentChat].push({text:m,type:"user"});
 save();

 bubble("Thinking...","ai");

 fetch("http://YOUR_BACKEND_IP:8000/chat",{
  method:"POST",
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({message:m})
 })
 .then(r=>r.json())
 .then(d=>{
  chatBox.lastChild.innerText=d.response;
  chats[currentChat].push({text:d.response,type:"ai"});
  save();
 });
}

function newChat(){
 chats.push([]);
 currentChat=chats.length-1;
 chatBox.innerHTML="";
 save();
}

function voice(){
 const r=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
 r.lang="en-US";
 r.start();
 r.onresult=e=>{
  msg.value=e.results[0][0].transcript;
  send();
 };
}

renderHistory();
</script>

</body>
</html>
